[package]
name = "khaymali-manager"
version = "3.0.0"
edition = "2021"
description = "Khaymali Manager Companion — classic Linux tunnels + Khaymali Light (pure Rust)"
license = "MIT"
authors = ["Khaymali"]
rust-version = "1.75"

[[bin]]
name = "khaymali-manager"
path = "src/main.rs"

[[bin]]
name = "khaymali-light"
path = "src/bin/khaymali_light.rs"

[dependencies]
libc = "0.2"
