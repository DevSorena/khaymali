[package]
name = "khaymali"
version = "0.21.0"
edition = "2021"
description = "Khaymali Tunnel v0.22.0: Entry <-> Bridge <-> Exit censorship-circumvention tunnel with Khaymali Full Tunneling Suite (WS/WSS, Bagher SSH, Spoof+WG, GRE 6to4/4in6/WSS Wraps, Auto-Dial Route, PathTest, Reverse-Path Doctor, Cluster Mesh & DNS Failover, Connectivity Rescue, Egress Bridge, 3-Layer Watchdog, Autopilot, Multi-Exit Pool, Adaptive XOR-FEC, Ktunnel, Session Resume, Noise_IK)"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
snow = "0.9"
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
