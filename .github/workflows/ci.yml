name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust build, unit, security & loopback CLI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Ensure Cargo.lock exists for reproducible builds
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: Unit tests (lib)
        run: cargo test --locked --lib

      - name: v0.15.1 regression tests (NLP guard, revert, artifacts, model fixes)
        run: cargo test --locked --lib v0151_ -- --nocapture

      - name: Negative security tests
        run: cargo test --locked --test neg_security

      - name: Release build
        run: cargo build --locked --release

      - name: Intelligence, Doctor & NLP CLI smoke tests
        run: bash tests/intelligence_cli.sh target/release/khaymali

      - name: Loopback integration suite (fail-closed)
        run: |
          set +e
          bash tests/integration.sh target/release/khaymali 2>&1 | tee /tmp/khaymali-integration.log
          INT_RC=${PIPESTATUS[0]}
          set -e
          PASSED=$(grep -cE "^  PASS:" /tmp/khaymali-integration.log || true)
          TOTAL_FAIL=$(grep -cE "^  FAIL:" /tmp/khaymali-integration.log || true)
          EXPECTED_FAIL=$(grep -E "^  FAIL:" /tmp/khaymali-integration.log | grep -c "plain-HTTP probe" || true)
          UNEXPECTED_FAIL=$((TOTAL_FAIL - EXPECTED_FAIL))
          printf '{"suite":"integration","exit_code":%d,"passed":%d,"failed":%d,"expected_fail":%d}\n' \
            "$INT_RC" "$PASSED" "$UNEXPECTED_FAIL" "$EXPECTED_FAIL" | tee /tmp/khaymali-integration-summary.json
          test "$PASSED" -gt 0
          test "$UNEXPECTED_FAIL" -eq 0
          if [ "$INT_RC" -ne 0 ] && [ "$EXPECTED_FAIL" -eq 0 ]; then
            echo "integration.sh exited $INT_RC without an expected-failure marker" >&2
            exit "$INT_RC"
          fi

      - name: Adaptive engine chaos test
        run: bash tests/chaos.sh target/release/khaymali

  scripts-lint:
    name: Shell & Python syntax checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          for f in install.sh scripts/*.sh tests/*.sh; do
            bash -n "$f"
          done
      - name: Manager / TUI checks
        run: |
          bash -n scripts/khaymali-manager
          bash tests/manager.sh
          python3 -m py_compile scripts/khaymali-tui
      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Test tooling (stress generator, impairment proxy, A/B gates) - no binary needed
        run: bash tests/scripts_selftest.sh
      - name: Validate Grafana JSON
        run: python3 -c "import json; json.load(open('deploy/grafana/khaymali-dashboard.json'))"
