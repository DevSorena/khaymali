name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build static ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            linker: ""
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install musl cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Build static release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Package tarball & SHA-256
        run: |
          STAGE="khaymali-${{ matrix.name }}"
          mkdir -p "$STAGE/deploy" "$STAGE/scripts"
          cp "target/${{ matrix.target }}/release/khaymali" "$STAGE/"
          cp -r deploy/* "$STAGE/deploy/"
          cp scripts/stress_live_300.sh scripts/check_baseline_regression.py scripts/ab_compare.py scripts/eval_nlp_replay.py scripts/make_annotation_set.py "$STAGE/scripts/"
          cp LICENSE README.md SECURITY.md CHANGELOG.md "$STAGE/"
          tar -czf "khaymali-${{ matrix.name }}.tar.gz" "$STAGE"
          sha256sum "khaymali-${{ matrix.name }}.tar.gz" > "khaymali-${{ matrix.name }}.tar.gz.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "khaymali-${{ matrix.name }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            khaymali-${{ matrix.name }}.tar.gz
            khaymali-${{ matrix.name }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
